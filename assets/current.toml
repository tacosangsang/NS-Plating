# 자산 현재본 목록. 소스(시트·소품·블록아웃·배경)는 여기 적힌 드라이브 파일만 쓴다.
# 항목은 사용자가 "확정본"이라고 한 문장(quote)이 있을 때만 confirmed로 올린다.
# 형식 설명은 assets/README.md, 검사는 python3 assets/check_assets.py

# [[asset]]
# key = "prop.ritual_tweezers_gold"   # kind.이름
# kind = "prop"                       # character / prop / bg / blockout_render / style_ref
# name = "드라이브 파일 이름"
# drive_id = ""
# md5 = ""                            # 드라이브가 주는 값. 이름이 아니라 이것으로 같은 파일을 판정
# hf_media_id = ""                    # Higgsfield에 한 번 올린 id 재사용
# status = "confirmed"                # confirmed / temp
# confirmed_by = "ts"
# confirmed_at = "2026-11-11"
# quote = "사용자 확정 문장"
# blockout = ""                       # blockout_render일 때 기준 블록아웃 판
# use = "시트 그대로 넣기, 흰 배경·배치만 무시"

